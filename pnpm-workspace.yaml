packages:
  - "apps/*"
  - "packages/*"
allowBuilds:
  '@nestjs/core': true
  '@prisma/client': true
  '@prisma/engines': true
  prisma: true
# why: correções de segurança (pnpm audit) em dependências transitivas, sem
# trocar de major. Remover cada linha quando a dependência direta que a puxa
# (Nest 10 / Next 15) já trouxer a versão corrigida.
overrides:
  multer: ^2.5.0
  body-parser: ^1.20.9
  proxy-addr: ^2.0.8
  qs: ^6.16.1
  postcss: ^8.5.23
  source-map-js: ^1.2.2
  uuid: ^11.1.1
